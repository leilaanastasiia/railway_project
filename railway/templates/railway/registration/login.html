{% extends 'railway/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h3>Please, enter required data:</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form><br>
    <a href="{% url 'railway:password_reset' %}">Forgot a password?</a>
    <p>Or not have an account? <a href="{% url 'railway:django_registration_register' %}">Create one!</a></p>
{% endblock content %}
