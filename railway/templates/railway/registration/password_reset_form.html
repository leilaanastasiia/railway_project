{% extends 'railway/base.html' %}

{% block title %}Password reset{% endblock %}

{% block content %}
    <h2>Password reset</h2>
    <p>Enter your email for the reset.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Reset</button>
    </form>
{% endblock content %}
